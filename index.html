<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBridge</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7c9cff;
      --user-bg: #2a3344;
      --assistant-bg: #1e222b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    header button:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message .role {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      align-self: flex-end;
    }

    .message.assistant .bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    #input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
    }

    #input-form {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      font-family: inherit;
    }

    #message-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #send-btn {
      background: var(--accent);
      color: #0f1115;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 8px 0;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>MindBridge</h1>
    <button id="new-chat-btn">New Chat</button>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <form id="input-form">
      <textarea
        id="message-input"
        placeholder="Type a message..."
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    // Correct project reference
    const SUPABASE_URL = "https://pnqnavicnbdljbfsmdwf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-fU5ouhldD3Ge6PCxX9u0w_YoKSj6Cy";

    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/chat`;

    let conversationId = localStorage.getItem("mindbridge_conversation_id") || null;

    const chatEl = document.getElementById("chat");
    const form = document.getElementById("input-form");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat-btn");

    // Auto-resize textarea
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    // Enter to send (Shift+Enter for new line)
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    newChatBtn.addEventListener("click", () => {
      conversationId = null;
      localStorage.removeItem("mindbridge_conversation_id");
      chatEl.innerHTML = "";
      input.focus();
    });

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="role">${role === "user" ? "You" : "MindBridge"}</div>
        <div class="bubble">${escapeHtml(content)}</div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing-indicator";
      el.textContent = "MindBridge is thinking...";
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      addMessage("user", message);
      showTyping();

      try {
        const res = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({
            message,
            conversation_id: conversationId
          })
        });

        const data = await res.json();

        hideTyping();

        if (!res.ok) {
          addMessage("assistant", `Error: ${data.error || "Something went wrong"}`);
        } else {
          addMessage("assistant", data.reply);
          conversationId = data.conversation_id;
          localStorage.setItem("mindbridge_conversation_id", conversationId);
        }
      } catch (err) {
        hideTyping();
        addMessage("assistant", "Network error. Please try again.");
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
