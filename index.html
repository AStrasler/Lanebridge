<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanebridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #1f1c18;
      --surface: #2a2621;
      --surface-raised: #332e27;
      --border: #453f36;
      --text: #ece7df;
      --muted: #a89c8c;
      --lane-olive: #7f8f6a;
      --lane-silver: #c7c2b4;
      --lanes: linear-gradient(90deg, var(--lane-olive), var(--lane-silver));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    :focus-visible { outline: 2px solid var(--lane-silver); outline-offset: 2px; }
    header {
      position: relative;
      padding: 18px 24px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--lanes);
      opacity: 0.85;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: 0.2px;
      color: var(--text);
    }
    .brand .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    header .actions { display: flex; gap: 10px; align-items: center; }
    header button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    header button:hover { color: var(--text); border-color: var(--lane-silver); }
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
    }
    .login-card h2 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .login-card label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .login-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      font-family: inherit;
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--lane-silver);
    }
    .login-card button {
      width: 100%;
      background: var(--lane-olive);
      color: var(--bg);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: #e07a7a;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }
    #app { display: none; flex-direction: column; height: 100vh; }
    #app.visible { display: flex; }
    #empty-state {
      max-width: 560px;
      margin: auto;
      text-align: left;
      padding: 0 20px;
    }
    #empty-state h2 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 1.6rem;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 10px;
    }
    #empty-state p {
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--muted);
      max-width: 440px;
    }
    #empty-state .lane-mark { display: flex; gap: 5px; margin-bottom: 16px; }
    #empty-state .lane-mark span {
      width: 22px; height: 3px; border-radius: 2px;
    }
    #empty-state .lane-mark span:nth-child(1) { background: var(--lane-olive); }
    #empty-state .lane-mark span:nth-child(2) { background: var(--lane-silver); }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #chat.is-empty { justify-content: center; }
    .message {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .message .role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .message .bubble {
      padding: 13px 17px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
    }
    .message.user .bubble {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      align-self: flex-end;
    }
    .message.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-image: var(--lanes) 1;
      border-image-slice: 1;
      border-width: 1px 1px 1px 3px;
    }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 18px 20px;
    }
    #input-form {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 1rem;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    #message-input:focus { outline: none; border-color: var(--lane-silver); }
    #send-btn {
      background: var(--lane-olive);
      color: var(--bg);
      border: none;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: filter 0.15s ease;
    }
    #send-btn:hover:not(:disabled) { filter: brightness(1.08); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 4px 0;
    }
    .typing .dots { display: flex; gap: 5px; }
    .typing .dot {
      width: 6px; height: 6px; border-radius: 50%;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .typing .dot:nth-child(1) { background: var(--lane-olive); animation-delay: 0s; }
    .typing .dot:nth-child(2) { background: var(--lane-silver); animation-delay: 0.22s; }
    .typing .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing .dot { animation: none; opacity: 0.8; }
    }
    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      #chat { padding: 20px 14px; }
      #input-area { padding: 14px 16px; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Lanebridge</h2>
      <p>Sign in to continue</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="submit" id="login-btn">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Main App (hidden until logged in) -->
  <div id="app">
    <header>
      <div class="brand">
        <h1>Lanebridge</h1>
        <span class="tag">parallel by default</span>
      </div>
      <div class="actions">
        <button id="new-chat-btn">New Chat</button>
        <button id="logout-btn">Log out</button>
      </div>
    </header>

    <div id="chat" class="is-empty">
      <div id="empty-state">
        <div class="lane-mark"><span></span><span></span></div>
        <h2>Start wherever the thread starts.</h2>
        <p>Jump topics, follow a condition, think out loud mid-sentence — Lanebridge stays with the lanes instead of forcing you into one at a time.</p>
      </div>
    </div>

    <div id="input-area">
      <form id="input-form">
        <textarea id="message-input" placeholder="Say what's on your mind..." rows="1"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pnqnavicnbdljbfsmdwf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-fU5ouhldD3Ge6PCxX9u0w_YoKSj6Cy";
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/chat`;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let conversationId = localStorage.getItem("lanebridge_conversation_id") || null;
    let accessToken = null;

    const loginScreen = document.getElementById("login-screen");
    const app = document.getElementById("app");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const loginBtn = document.getElementById("login-btn");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("input-form");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const logoutBtn = document.getElementById("logout-btn");

    // Check existing session on load
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        accessToken = session.access_token;
        showApp();
      } else {
        showLogin();
      }

      supabase.auth.onAuthStateChange((_event, session) => {
        if (session) {
          accessToken = session.access_token;
          showApp();
        } else {
          accessToken = null;
          showLogin();
        }
      });
    }

    function showLogin() {
      loginScreen.style.display = "flex";
      app.classList.remove("visible");
    }

    function showApp() {
      loginScreen.style.display = "none";
      app.classList.add("visible");
      input.focus();
    }

    // Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.style.display = "none";
      loginBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginError.textContent = error.message;
        loginError.style.display = "block";
        loginBtn.disabled = false;
        return;
      }

      accessToken = data.session.access_token;
      showApp();
      loginBtn.disabled = false;
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      conversationId = null;
      localStorage.removeItem("lanebridge_conversation_id");
      chatEl.classList.add("is-empty");
      chatEl.innerHTML = emptyStateHTML;
    });

    // Chat UI helpers
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    const emptyStateHTML = `
      <div id="empty-state">
        <div class="lane-mark"><span></span><span></span></div>
        <h2>Start wherever the thread starts.</h2>
        <p>Jump topics, follow a condition, think out loud mid-sentence — Lanebridge stays with the lanes instead of forcing you into one at a time.</p>
      </div>
    `;

    newChatBtn.addEventListener("click", () => {
      conversationId = null;
      localStorage.removeItem("lanebridge_conversation_id");
      chatEl.classList.add("is-empty");
      chatEl.innerHTML = emptyStateHTML;
      input.focus();
    });

    function addMessage(role, content) {
      if (chatEl.classList.contains("is-empty")) {
        chatEl.classList.remove("is-empty");
        chatEl.innerHTML = "";
      }
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="role">${role === "user" ? "You" : "Lanebridge"}</div>
        <div class="bubble">${escapeHtml(content)}</div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing-indicator";
      el.innerHTML = `
        <span class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <span class="label">Processing lanes</span>
      `;
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    // Send message
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || !accessToken) return;

      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      addMessage("user", message);
      showTyping();

      try {
        const res = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken}`,
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({
            message,
            conversation_id: conversationId
          })
        });

        const data = await res.json();
        hideTyping();

        if (!res.ok) {
          addMessage("assistant", `Error: ${data.error || "Something went wrong"}`);
        } else {
          addMessage("assistant", data.reply);
          conversationId = data.conversation_id;
          localStorage.setItem("lanebridge_conversation_id", conversationId);
        }
      } catch (err) {
        hideTyping();
        addMessage("assistant", "Network error. Please try again.");
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    init();
  </script>
</body>
</html>
